<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARBUCKS: ASTRO-BLEND</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@100;300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor-follower"></div>
    <div class="space-background"></div>
    
    <header>
        <div class="container">
            <h1 class="logo"><a href="#"><img src="./images/logo.png" alt="Starbucks"></a></h1>
            <nav>
                <ul class="nav-menu">
                    <li><a href="#">MISSION</a></li>
                    <li><a href="#">PLANETS</a></li>
                    <li><a href="#">STARLINK</a></li>
                    <li><a href="#">RESERVE</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container flex-box">
                <div class="hero-content">
                    <span class="badge">BEYOND THE ATMOSPHERE</span>
                    <h2 class="main-title">STARBUCKS<br>ASTRO-BLEND</h2> <p class="description">
                        은하계의 성운을 담은 단 한 잔의 휴식.<br>
                        스타벅스 아스트로-블렌드와 함께 화성으로의 여정을 시작하세요.
                    </p>
                    <a href="#" class="btn-primary">LAUNCH ORDER</a>
                </div>

                <div class="galaxy-display">
                    <div class="planet-unit earth-pos">
                        <div class="interaction-area">
                            <img src="./images/cup.png" alt="Earth Drink" class="drink-popup">
                            <img src="./images/planet_earth.png" alt="Earth" class="planet-img">
                        </div>
                    </div>
                    <div class="planet-unit mars-pos">
                        <div class="interaction-area">
                            <img src="./images/drink_red.png" alt="Mars Drink" class="drink-popup">
                            <img src="./images/planet_mars.png" alt="Mars" class="planet-img">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Starbucks Galaxy Project. Designed by Kim Yeo-won.</p>
    </footer>

    <script>
        const cursor = document.querySelector('.cursor-follower');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
