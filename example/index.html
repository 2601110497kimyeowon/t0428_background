<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Galaxy | In Collaboration with SpaceX</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="space-background"></div>

    <header>
        <div class="container">
            <h1 class="logo">
                <a href="#"><img src="./images/logo.png" alt="Starbucks"></a>
            </h1>
            <nav>
                <ul class="nav-menu">
                    <li><a href="#">MISSION</a></li>
                    <li><a href="#">PLANETS</a></li>
                    <li><a href="#">STARLINK</a></li>
                    <li><a href="#">RESERVE</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="hero">
        <div class="container">
            <div class="hero-content">
                <span class="badge">IN COLLABORATION WITH SPACEX</span>
                <h2 class="main-title">STARDUST<br>BREWING</h2>
                <p class="description">
                    일론 머스크의 화성 이주 계획과 함께하는 스타벅스의 새로운 여정.<br>
                    은하계 어디서나 완벽한 한 잔의 휴식을 경험하세요.
                </p>
                <div class="cta-area">
                    <a href="#" class="btn-primary">LAUNCH ORDER</a>
                </div>
            </div>
            
            <div class="hero-visual">
                <img src="./images/cup.png" alt="Space Coffee" class="floating-cup">
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Starbucks Galaxy Project. Designed by Kim Yeo-won.</p>
        </div>
    </footer>
</body>
</html>
