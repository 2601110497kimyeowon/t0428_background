<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Galaxy | In Collaboration with SpaceX</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+KR:wght@100;300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="space-bg"></div>

    <header>
        <div class="inner-container">
            <a href="#" class="logo"><img src="./images/logo.png" alt="Starbucks"></a>
            <nav>
                <ul class="gnb">
                    <li><a href="#">MISSION</a></li>
                    <li><a href="#">PLANETS</a></li>
                    <li><a href="#">STARLINK</a></li>
                    <li><a href="#">RESERVE</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-hero">
        <div class="inner-container">
            <article class="hero-text">
                <div class="top-label">IN COLLABORATION WITH SPACEX</div>
                <h1 class="main-title">STARDUST<br>BREWING</h1>
                <p class="sub-desc">
                    일론 머스크의 화성 이주 계획과 함께하는 스타벅스의 새로운 여정.<br>
                    은하계 어디서나 완벽한 한 잔의 휴식을 경험하세요.
                </p>
                <div class="cta-wrap">
                    <a href="#" class="btn-launch">LAUNCH ORDER</a>
                </div>
            </article>
            
            <figure class="hero-visual">
                <img src="./images/cup" alt="Nebula Cold Brew" class="floating-cup">
                <div class="orbit-line"></div>
            </figure>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Starbucks Galaxy Project. Visual Design Studio.</p>
    </footer>
</body>
</html>cup
