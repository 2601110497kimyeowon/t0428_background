<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+Meroitic&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
        }

        section {
            position: relative;
            width: 1600px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: rgb(255, 200, 0);
            padding: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header {
            position:absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            padding: 20px 100px;
            justify-content: space-between;
            align-items: center;
        
        }

        header  .logo {
            position: relative;
            max-width: 80px;
        }
        
        header ul {
            position: relative;
            display: flex;
        }

        header ul li {
            list-style: none;
        }

        header ul li a {
            display: inline-block;
            color: #000;
            margin-left: 40px;
            text-decoration: none;
        }

        .content {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content .textBox {
            position: relative;
            max-width: 600px;
        }
        .content .textBox h2 {
            font-size: 4em;
            color: #333;
            font-weight: 500;
        }

        .content .textBox h2 span {
            color: #017143;
            font-size: 1.2em;
            font-weight: 900;
        }

        .content .textBox a{
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background-color: #017143;
            color: #fff;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .content .imgBox {
            width: 600px;
            background-color: #fff;
            display: flex;
            justify-content: flex-end;
            padding-right: 50px;
            margin-top: 50px;
        }

        .content .imgBox img {
            max-width: 340px;
        }

        .thumb {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
        }

        
    </style>
   <body>
     <section>
        <div class="circle"></div>
        <header>
           <a href="#" class="logo"><img src="./imgs/logo.png" alt=""></a>
           <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">What's New</a></li>
            <li><a href="#">Contact</a></li>
           </ul>
        </header>
        <div class="content">
            <div class ="textBox">
                <h2>It's not just Coffee <br><span>It's Starbucks</span></h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.</p>
                <a href="#">Learn More</a>
        </div>

        <div class="imgBox" alt="">
            <img src="./imgs/img1.png" alt="Starbucks Coffee">
        </div>
        </div>
        <ul class="thumb">
            <li><img src="./imgs/thumb1.png" alt=""></li>
            <li><img src="./imgs/thumb2.png" alt=""></li>
            <li><img src="./imgs/thumb3.png" alt=""></li>
        </ul>
        <ul class="sci">
            <li><a href="#"><img src="./imgs/facebook.png" alt=""></a></li>
            <li><a href="#"><img src="./imgs/twitter.png" alt=""></a></li>
            <li><a href="#"><img src="./imgs/instagram.png" alt=""></a></li>
     </section>
   </body>
</html>
