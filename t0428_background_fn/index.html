<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Landing Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic&family=Noto+Sans+KR:wght@100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
        }

        section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            padding: 20px 100px;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        header .logo {
            max-width: 80px;
        }
        
        header ul {
            display: flex;
        }

        header ul li {
            list-style: none;
        }

        header ul li a {
            display: inline-block;
            color: #333;
            font-weight: 400;
            margin-left: 40px;
            text-decoration: none;
        }

        .content {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .content .textBox {
            position: relative;
            max-width: 600px;
        }

        .content .textBox h2 {
            font-size: 4em;
            color: #333;
            line-height: 1.4em;
            font-weight: 500;
        }

        .content .textBox h2 span {
            color: #017143;
            font-size: 1.2em;
            font-weight: 900;
        }

        .content .textBox p {
            color: #333;
        }

        .content .textBox a {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background-color: #017143;
            color: #fff;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .content .imgBox {
            width: 600px;
            display: flex;
            justify-content: flex-end;
            padding-right: 50px;
        }

        .content .imgBox img {
            max-width: 340px;
        }

        .thumb {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            z-index: 100;
        }

        .thumb li {
            list-style: none;
            margin: 0 20px;
            cursor: pointer;
            transition: .5s;
        }

        .thumb li:hover {
            transform: translateY(-15px);
        }

        .thumb li img {
            max-width: 60px;
        }

        .sci {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }

        .sci li {
            list-style: none;
        }

        .sci li a {
            display: inline-block;
            margin: 5px 0;
            transform: scale(0.6);
            filter: invert(1);
        }

        .circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #017143;
            clip-path: circle(600px at right 800px);
            transition: 0.5s ease; /* 색상 변경 시 부드러운 효과 */
        }
    </style>
</head>
<body>
    <section>
        <div class="circle"></div>
        <header>
            <a href="#" class="logo"><img src="./imgs/logo.png" alt="Logo"></a>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">What's New</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </header>

        <div class="content">
            <div class="textBox">
                <h2>It's not just Coffee <br><span>It's Starbucks</span></h2>
                <p>맛있는 음료와 함께 스타벅스의 특별한 경험을 만나보세요. 단순한 커피 그 이상의 가치를 전달합니다.</p>
                <a href="#">Learn More</a>
            </div>

            <div class="imgBox">
                <img src="./imgs/img1.png" class="starbucks" alt="Main Drink">
            </div>
        </div>

        <ul class="thumb">
            <!-- 클릭 시 이미지 변경과 원 색상 변경 함수 호출 -->
            <li><img src="./imgs/thumb1.png" onclick="imgSlider('./imgs/img1.png'); changeCircleColor('#017143')"></li>
            <li><img src="./imgs/thumb2.png" onclick="imgSlider('./imgs/img2.png'); changeCircleColor('#eb7495')"></li>
            <li><img src="./imgs/thumb3.png" onclick="imgSlider('./imgs/img3.png'); changeCircleColor('#d752b1')"></li>
        </ul>

        <ul class="sci">
            <li><a href="#"><img src="./imgs/facebook.png"></a></li>
            <li><a href="#"><img src="./imgs/twitter.png"></a></li>
            <li><a href="#"><img src="./imgs/instagram.png"></a></li>
        </ul>
    </section>

    <script>
        // 메인 이미지 변경 함수
        function imgSlider(anything) {
            document.querySelector('.starbucks').src = anything;
        }

        // 배경 원 색상 변경 함수
        function changeCircleColor(color) {
            const circle = document.querySelector('.circle');
            circle.style.background = color;
        }
    </script>
</body>
</html>
